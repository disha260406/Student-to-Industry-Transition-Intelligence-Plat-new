<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Results - Student Career Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            top: -250px;
            right: -250px;
            border-radius: 50%;
            pointer-events: none;
        }
        .header {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .header-left h1 {
            color: #1e293b;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .header-left p {
            color: #64748b;
        }
        .header-right {
            display: flex;
            gap: 1rem;
        }
        .btn {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        .btn-outline {
            background: white;
            color: #3b82f6;
            border: 2px solid #3b82f6;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: #3b82f6;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .result-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .result-card h2 {
            color: #667eea;
            margin-bottom: 1.5rem;
        }
        .score {
            font-size: 4rem;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            margin: 2rem 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        .stat {
            text-align: center;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .loading {
            text-align: center;
            padding: 4rem;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .github-verification {
            background: #e7f3ff;
            border: 2px solid #2196F3;
            padding: 1.5rem;
            border-radius: 10px;
            margin: 1.5rem 0;
        }
        .github-verification h3 {
            color: #2196F3;
            margin-bottom: 1rem;
        }
        .skill-item {
            display: inline-block;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .skill-verified {
            background: #d4edda;
            color: #155724;
        }
        .skill-unverified {
            background: #fff3cd;
            color: #856404;
        }
        .skill-additional {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>📊 My Results</h1>
                <p id="welcomeText">Loading...</p>
            </div>
            <div class="header-right">
                <a href="applications.html" class="btn">📋 My Applications</a>
                <a href="jobs.html" class="btn btn-outline">💼 Browse Jobs</a>
                <a href="index.html" class="btn btn-outline">🏠 Home</a>
                <button onclick="logout()" class="btn btn-outline">🚪 Logout</button>
            </div>
        </div>
        
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading your results...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        
        async function loadResults() {
            const urlParams = new URLSearchParams(window.location.search);
            const studentId = urlParams.get('id') || localStorage.getItem('studentId');
            const studentName = localStorage.getItem('studentName') || 'Student';
            
            if (!studentId) {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('welcomeText').textContent = `Welcome back, ${studentName}!`;
            
            try {
                // Get student data + prediction in parallel
                const [studentRes, predRes] = await Promise.all([
                    fetch(`${API_URL}/students/${studentId}`),
                    fetch(`${API_URL}/analysis/predict-placement/${studentId}`)
                ]);
                
                const studentResult = await studentRes.json();
                const predResult = await predRes.json();
                
                if (!predResult.success) throw new Error('Failed to load prediction');
                
                const pred = predResult.data;
                const student = studentResult.success ? studentResult.data : null;
                const readinessColor = pred.placement_readiness === 'High' ? '#22c55e' : 
                                       pred.placement_readiness === 'Medium' ? '#f59e0b' : '#ef4444';
                
                document.getElementById('content').innerHTML = `
                    <div class="result-card">
                        <h2>🎯 Placement Readiness</h2>
                        <div class="score" style="color:${readinessColor}">${pred.placement_probability.toFixed(0)}%</div>
                        <p style="text-align:center;color:#666;font-size:1.1rem;margin-bottom:2rem;">${pred.placement_readiness} Readiness</p>
                        
                        <div class="grid">
                            <div class="stat"><div class="stat-value">${pred.factors.cgpa}</div><div class="stat-label">CGPA</div></div>
                            <div class="stat"><div class="stat-value">${pred.factors.skills_count}</div><div class="stat-label">Skills</div></div>
                            <div class="stat"><div class="stat-value">${pred.factors.internships_count}</div><div class="stat-label">Internships</div></div>
                            <div class="stat"><div class="stat-value">${pred.factors.projects_count}</div><div class="stat-label">Projects</div></div>
                            <div class="stat"><div class="stat-value">${pred.factors.certifications_count}</div><div class="stat-label">Certifications</div></div>
                        </div>
                        
                        <h3 style="margin-top:2rem;color:#667eea;">💡 Recommendations</h3>
                        <ul style="margin-top:1rem;padding-left:2rem;">
                            ${pred.recommendations.map(r => `<li style="margin-bottom:0.75rem;">${r}</li>`).join('')}
                        </ul>
                    </div>
                    
                    <div id="githubSection">
                        ${student && student.github_url ? `
                        <div class="result-card">
                            <h2>🐙 GitHub Skill Verification</h2>
                            <div id="githubContent">
                                <div class="loading"><div class="spinner"></div><p>Fetching your GitHub repos...</p></div>
                            </div>
                        </div>` : `
                        <div class="result-card" style="text-align:center;padding:2rem;">
                            <p style="color:#64748b;font-size:1rem;">No GitHub profile linked. <a href="register.html" style="color:#3b82f6;">Add it during registration</a> to verify your skills.</p>
                        </div>`}
                    </div>

                    <div id="applicationsSection"></div>

                    <div id="portfolioSection"></div>

                    <div id="curriculumSection"></div>
                `;
                
                // If student has GitHub, fetch verification
                if (student && student.github_url) {
                    loadGitHub(student.github_url, student.skills || localStorage.getItem('studentSkills') || '');
                }

                // Load applications tracker
                loadApplications();

                // Load portfolio from API
                loadPortfolio(studentId);

                // Load curriculum section
                loadCurriculumSection();
                
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="result-card">
                        <h2 style="color:#dc3545;">❌ Error Loading Results</h2>
                        <p>${error.message}</p>
                        <a href="login.html" class="btn" style="margin-top:1rem;display:inline-block;">Try Again</a>
                    </div>`;
            }
        }
        
        async function loadGitHub(githubUrl, skills) {
            try {
                const res = await fetch(`${API_URL}/students/verify-github`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ github_url: githubUrl, skills: skills })
                });
                const gh = await res.json();
                
                const el = document.getElementById('githubContent');
                if (!el) return;
                
                if (!gh.success) {
                    if (gh.error && gh.error.includes('rate limit')) {
                        el.innerHTML = `
                            <div style="background:#fff7ed;border:1px solid #fed7aa;padding:1.25rem;border-radius:10px;">
                                <p style="font-weight:700;color:#9a3412;margin-bottom:0.5rem;">⏳ GitHub API limit reached</p>
                                <p style="color:#78350f;font-size:0.9rem;margin-bottom:0.75rem;">Add a token to fix this permanently.</p>
                                <a href="https://github.com/settings/tokens/new" target="_blank" style="background:#1e293b;color:white;padding:0.5rem 1.2rem;border-radius:8px;text-decoration:none;font-size:0.88rem;font-weight:600;">Generate GitHub Token →</a>
                            </div>`;
                    } else if (gh.error && gh.error.includes('No public repositories')) {
                        el.innerHTML = `
                            <div style="background:#f0f9ff;border:1px solid #bae6fd;padding:1.25rem;border-radius:10px;">
                                <p style="font-weight:700;color:#0369a1;margin-bottom:0.5rem;">📂 No Public Repositories Found</p>
                                <p style="color:#0c4a6e;font-size:0.9rem;margin-bottom:0.75rem;">
                                    Your GitHub account <strong>${gh.error.split(': ')[1] || ''}</strong> exists but has no public repositories yet.
                                    Skill verification requires at least one public repo.
                                </p>
                                <p style="color:#0c4a6e;font-size:0.85rem;">To enable verification:</p>
                                <ul style="color:#0c4a6e;font-size:0.85rem;padding-left:1.2rem;margin-top:0.4rem;line-height:1.8;">
                                    <li>Push your projects to GitHub as public repositories</li>
                                    <li>Make sure your repos contain code (not just README files)</li>
                                    <li>Re-submit your profile once repos are public</li>
                                </ul>
                                <a href="https://github.com/new" target="_blank" style="display:inline-block;margin-top:0.75rem;background:#1e293b;color:white;padding:0.5rem 1.2rem;border-radius:8px;text-decoration:none;font-size:0.88rem;font-weight:600;">Create a Repository →</a>
                            </div>`;
                    } else {
                        el.innerHTML = `
                            <div style="background:#fef2f2;border:1px solid #fecaca;padding:1.25rem;border-radius:10px;">
                                <p style="font-weight:700;color:#991b1b;margin-bottom:0.4rem;">⚠️ Could not verify GitHub</p>
                                <p style="color:#7f1d1d;font-size:0.9rem;">${gh.error || 'Unknown error occurred.'}</p>
                            </div>`;
                    }
                    return;
                }

                const verified = gh.verified_skills || [];
                const unverified = gh.unverified_skills || [];

                const verifiedHtml = verified.map(s =>
                    `<div style="display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0.9rem;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;">
                        <span style="font-weight:600;color:#15803d;font-size:0.9rem;">✅ ${s.skill}</span>
                        <span style="font-size:0.78rem;color:#16a34a;background:#dcfce7;padding:0.2rem 0.6rem;border-radius:20px;">${s.project_count} project${s.project_count > 1 ? 's' : ''}</span>
                    </div>`
                ).join('');

                const unverifiedHtml = unverified.map(s =>
                    `<div style="display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0.9rem;background:#fff7ed;border-radius:8px;border:1px solid #fed7aa;">
                        <span style="font-weight:600;color:#b45309;font-size:0.9rem;">⚠️ ${s.skill}</span>
                        <span style="font-size:0.78rem;color:#92400e;background:#fef3c7;padding:0.2rem 0.6rem;border-radius:20px;">Not found in repos</span>
                    </div>`
                ).join('');

                el.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;margin-bottom:1.25rem;">
                        <div style="display:flex;align-items:center;gap:0.75rem;">
                            <span style="background:#22c55e;color:white;padding:0.35rem 1rem;border-radius:20px;font-size:0.88rem;font-weight:600;">${gh.verification_score}% Verified</span>
                            <a href="https://github.com/${gh.username}" target="_blank" style="color:#3b82f6;font-size:0.88rem;">@${gh.username} ↗</a>
                        </div>
                        <span style="color:#64748b;font-size:0.82rem;">${gh.total_repos} repos · ${gh.total_commits_checked} commits checked</span>
                    </div>

                    ${verified.length > 0 ? `
                    <p style="font-size:0.85rem;font-weight:700;color:#15803d;margin-bottom:0.5rem;">Skills matched in your GitHub</p>
                    <div style="display:flex;flex-wrap:wrap;gap:0.5rem;">${verified.map(s =>
                        `<span style="padding:0.4rem 1rem;background:#dcfce7;color:#15803d;border-radius:20px;font-size:0.88rem;font-weight:600;border:1px solid #bbf7d0;">✅ ${s.skill}</span>`
                    ).join('')}</div>` : '<p style="color:#64748b;">No skills matched in your GitHub repos.</p>'}
                `;
                
            } catch (err) {
                const el = document.getElementById('githubContent');
                if (el) el.innerHTML = `<p style="color:#dc2626;">Could not fetch GitHub data: ${err.message}</p>`;
            }
        }
        
        function loadApplications() {
            const el = document.getElementById('applicationsSection');
            if (!el) return;

            const sid = localStorage.getItem('studentId');
            if (!sid) { renderAppsSummary([]); return; }

            fetch(`${API_URL}/applications/${sid}`)
                .then(r => r.json())
                .then(result => {
                    const applications = result.success ? result.data : [];
                    // sync cache
                    localStorage.setItem('applications', JSON.stringify(applications));
                    renderAppsSummary(applications);
                })
                .catch(() => renderAppsSummary(JSON.parse(localStorage.getItem('applications') || '[]')));
        }

        function renderAppsSummary(applications) {
            const el = document.getElementById('applicationsSection');
            if (!el) return;

            const selected = applications.filter(a => a.status === 'Selected').length;
            const shortlisted = applications.filter(a => a.status === 'Shortlisted').length;
            const pending = applications.filter(a => a.status === 'Applied').length;

            const recentHtml = applications.slice(0, 3).map(app => {
                const statusColors = { 'Applied':'#3b82f6', 'Shortlisted':'#d97706', 'Selected':'#16a34a', 'Rejected':'#dc2626' };
                const c = statusColors[app.status] || '#3b82f6';
                return `<div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem 0;border-bottom:1px solid #f1f5f9;">
                    <div>
                        <div style="font-weight:600;color:#1e293b;font-size:0.9rem;">${app.job_role}</div>
                        <div style="color:#64748b;font-size:0.8rem;">${app.company} · ${app.applied_date}</div>
                    </div>
                    <span style="background:${c}22;color:${c};padding:0.2rem 0.75rem;border-radius:20px;font-size:0.78rem;font-weight:700;">${app.status}</span>
                </div>`;
            }).join('');

            el.innerHTML = `
                <div class="result-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.25rem;">
                        <h2>📋 My Applications</h2>
                        <a href="applications.html" style="background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;padding:0.6rem 1.2rem;border-radius:8px;text-decoration:none;font-size:0.9rem;font-weight:600;">View All →</a>
                    </div>
                    ${applications.length === 0 ? `
                        <p style="color:#64748b;text-align:center;padding:1.5rem 0;">No applications yet. <a href="jobs.html" style="color:#3b82f6;font-weight:600;">Browse Jobs →</a></p>
                    ` : `
                        <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
                            <div style="flex:1;min-width:90px;background:#eff6ff;border-radius:12px;padding:1rem;text-align:center;">
                                <div style="font-size:1.6rem;font-weight:700;color:#3b82f6;">${applications.length}</div>
                                <div style="font-size:0.8rem;color:#64748b;">Applied</div>
                            </div>
                            <div style="flex:1;min-width:90px;background:#f0fdf4;border-radius:12px;padding:1rem;text-align:center;">
                                <div style="font-size:1.6rem;font-weight:700;color:#16a34a;">${selected}</div>
                                <div style="font-size:0.8rem;color:#64748b;">Selected</div>
                            </div>
                            <div style="flex:1;min-width:90px;background:#fefce8;border-radius:12px;padding:1rem;text-align:center;">
                                <div style="font-size:1.6rem;font-weight:700;color:#d97706;">${shortlisted}</div>
                                <div style="font-size:0.8rem;color:#64748b;">Shortlisted</div>
                            </div>
                            <div style="flex:1;min-width:90px;background:#f8fafc;border-radius:12px;padding:1rem;text-align:center;">
                                <div style="font-size:1.6rem;font-weight:700;color:#64748b;">${pending}</div>
                                <div style="font-size:0.8rem;color:#64748b;">Pending</div>
                            </div>
                        </div>
                        <p style="font-size:0.85rem;font-weight:600;color:#475569;margin-bottom:0.25rem;">Recent Activity</p>
                        ${recentHtml}
                        <div style="text-align:center;margin-top:1rem;">
                            <a href="applications.html" style="color:#3b82f6;font-size:0.88rem;font-weight:600;text-decoration:none;">See full history →</a>
                        </div>
                    `}
                </div>`;
        }

        async function loadPortfolio(studentId) {
            const el = document.getElementById('portfolioSection');
            if (!el) return;

            let certs = [], internships = [], projects = [];
            try {
                const [portRes, studRes] = await Promise.all([
                    fetch(`${API_URL}/students/${studentId}/portfolio`),
                    fetch(`${API_URL}/students/${studentId}`)
                ]);
                const portResult = await portRes.json();
                const studResult = await studRes.json();
                const student = studResult.success ? studResult.data : null;

                if (portResult.success) {
                    certs = portResult.data.certificates || [];
                    internships = portResult.data.internships || [];
                    projects = portResult.data.projects || [];
                }

                // If portfolio tables empty but counts exist, generate placeholders from counts
                if (certs.length === 0 && student && student.certifications_count > 0) {
                    for (let i = 1; i <= student.certifications_count; i++)
                        certs.push({ name: `Certificate ${i}`, file_name: '', has_file: 0, placeholder: true });
                }
                if (internships.length === 0 && student && student.internships_count > 0) {
                    for (let i = 1; i <= student.internships_count; i++)
                        internships.push({ company: `Company ${i}`, role: 'Intern', duration: '', has_certificate: 0, placeholder: true });
                }
                if (projects.length === 0 && student && student.projects_count > 0) {
                    for (let i = 1; i <= student.projects_count; i++)
                        projects.push({ name: `Project ${i}`, placeholder: true });
                }
            } catch(e) {
                certs = JSON.parse(localStorage.getItem('portfolioCerts') || '[]');
                internships = JSON.parse(localStorage.getItem('portfolioInternships') || '[]');
                projects = JSON.parse(localStorage.getItem('portfolioProjects') || '[]');
            }

            const isPlaceholder = [...certs, ...internships, ...projects].some(x => x.placeholder);

            const certsHtml = certs.length > 0
                ? certs.filter(c => c.name).map(c => `
                    <div style="background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:0.75rem 1rem;">
                        <div style="display:flex;align-items:center;gap:0.75rem;">
                            <span style="font-size:1.3rem;">🏅</span>
                            <div style="flex:1;">
                                <div style="font-weight:600;color:#1e293b;font-size:0.9rem;">${c.placeholder ? '📝 ' + c.name + ' <em style="color:#94a3b8;font-size:0.75rem;">(details not saved)</em>' : c.name}</div>
                                ${c.file_name && !c.placeholder ? `<div style="font-size:0.75rem;color:#92400e;">📄 ${c.file_name}</div>` : ''}
                            </div>
                            ${(c.has_file == 1) ? `<span style="background:#d97706;color:white;font-size:0.7rem;padding:2px 8px;border-radius:20px;font-weight:600;">PDF ✓</span>` : ''}
                        </div>
                        ${(c.has_file == 1) ? `
                        <div style="margin-top:0.6rem;">
                            <a href="${API_URL}/students/uploads/${c.id}/cert" target="_blank"
                               style="display:inline-flex;align-items:center;gap:5px;background:#1e293b;color:white;padding:4px 14px;border-radius:6px;font-size:0.78rem;font-weight:600;text-decoration:none;">
                               👁 View PDF
                            </a>
                        </div>` : ''}
                    </div>`).join('')
                : `<p style="color:#94a3b8;font-size:0.88rem;text-align:center;padding:1rem 0;">No certificates added yet.</p>`;

            const internsHtml = internships.length > 0
                ? internships.map(i => `
                    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:0.75rem 1rem;">
                        <div style="display:flex;align-items:flex-start;gap:0.75rem;">
                            <span style="font-size:1.3rem;">🏢</span>
                            <div style="flex:1;">
                                <div style="font-weight:600;color:#1e293b;font-size:0.9rem;">${i.placeholder ? '📝 Internship <em style="color:#94a3b8;font-size:0.75rem;">(details not saved)</em>' : (i.role || 'Intern') + ' @ ' + (i.company || 'Company')}</div>
                                ${i.duration && !i.placeholder ? `<div style="font-size:0.78rem;color:#3b82f6;">⏱ ${i.duration}</div>` : ''}
                            </div>
                            ${(i.has_certificate == 1) ? `<span style="background:#2563eb;color:white;font-size:0.7rem;padding:2px 8px;border-radius:20px;font-weight:600;">PDF ✓</span>` : ''}
                        </div>
                        ${(i.has_certificate == 1) ? `
                        <div style="margin-top:0.6rem;">
                            <a href="${API_URL}/students/uploads/${i.id}/intern" target="_blank"
                               style="display:inline-flex;align-items:center;gap:5px;background:#1e293b;color:white;padding:4px 14px;border-radius:6px;font-size:0.78rem;font-weight:600;text-decoration:none;">
                               👁 View PDF
                            </a>
                        </div>` : ''}
                    </div>`).join('')
                : `<p style="color:#94a3b8;font-size:0.88rem;text-align:center;padding:1rem 0;">No internships added yet.</p>`;

            const projectsHtml = projects.length > 0
                ? projects.map(p => `
                    <div style="display:flex;align-items:center;gap:0.75rem;padding:0.75rem 1rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;">
                        <span style="font-size:1.3rem;">🛠</span>
                        <div style="font-weight:600;color:#1e293b;font-size:0.9rem;">${p.name}</div>
                    </div>`).join('')
                : `<p style="color:#94a3b8;font-size:0.88rem;text-align:center;padding:1rem 0;">No projects added yet.</p>`;

            el.innerHTML = `
                <div class="result-card">
                    <h2 style="margin-bottom:1.5rem;">🗂️ My Portfolio</h2>

                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;">

                        <div>
                            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">
                                <span style="font-size:1.1rem;">🏅</span>
                                <h3 style="color:#1e293b;font-size:1rem;">Certificates <span style="background:#fde68a;color:#92400e;font-size:0.75rem;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:4px;">${certs.filter(c=>c.name).length}</span></h3>
                            </div>
                            <div style="display:flex;flex-direction:column;gap:0.5rem;">${certsHtml}</div>
                        </div>

                        <div>
                            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">
                                <span style="font-size:1.1rem;">🏢</span>
                                <h3 style="color:#1e293b;font-size:1rem;">Internships <span style="background:#bfdbfe;color:#1d4ed8;font-size:0.75rem;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:4px;">${internships.length}</span></h3>
                            </div>
                            <div style="display:flex;flex-direction:column;gap:0.5rem;">${internsHtml}</div>
                        </div>

                        <div>
                            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">
                                <span style="font-size:1.1rem;">🛠</span>
                                <h3 style="color:#1e293b;font-size:1rem;">Projects <span style="background:#bbf7d0;color:#15803d;font-size:0.75rem;padding:2px 8px;border-radius:20px;font-weight:700;margin-left:4px;">${projects.length}</span></h3>
                            </div>
                            <div style="display:flex;flex-direction:column;gap:0.5rem;">${projectsHtml}</div>
                        </div>

                    </div>

                    ${isPlaceholder ? `
                    <div style="margin-top:1.25rem;background:#fef9c3;border:1px solid #fde047;border-radius:10px;padding:0.9rem 1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;">
                        <p style="color:#854d0e;font-size:0.85rem;margin:0;">⚠️ Your portfolio was registered before detailed saving was enabled. Re-register to add names and upload PDFs.</p>
                        <a href="register.html" style="background:#1e293b;color:white;padding:6px 16px;border-radius:8px;font-size:0.82rem;font-weight:600;text-decoration:none;white-space:nowrap;">+ Update Portfolio</a>
                    </div>` : ''}
                </div>`;
        }

        function loadCurriculumSection() {
            const el = document.getElementById('curriculumSection');
            if (!el) return;
            const sid = localStorage.getItem('studentId');
            if (!sid) return;

            el.innerHTML = `
                <div class="result-card">
                    <h2 style="margin-bottom:1rem;">📚 Curriculum Gap Analysis</h2>

                    <div style="border:2px dashed #cbd5e1;border-radius:10px;padding:1.25rem;text-align:center;cursor:pointer;background:#f8fafc;position:relative;transition:all 0.2s;"
                         id="currBox" onclick="document.getElementById('curr_pdf').click()">
                        <input type="file" id="curr_pdf" accept=".pdf" style="display:none" onchange="handleCurrUpload(this)">
                        <button type="button" id="currEye" onclick="event.stopPropagation();previewCurrPdf()" style="display:none;position:absolute;top:8px;right:10px;background:none;border:none;font-size:1.1rem;cursor:pointer;">👁</button>
                        <label id="currLbl" style="cursor:pointer;color:#64748b;font-size:0.9rem;">📄 Click to upload College Syllabus PDF</label>
                    </div>

                    <div id="curriculumResult" style="margin-top:1.25rem;"></div>
                </div>`;

            // Auto-run if syllabus already saved in DB
            fetch(`${API_URL}/analysis/curriculum-gap/${sid}`)
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('currLbl').textContent = '✅ Syllabus already uploaded';
                        document.getElementById('currBox').style.borderColor = '#22c55e';
                        document.getElementById('currBox').style.background = '#f0fdf4';
                        renderCurriculumResult(data);
                    }
                    // If no syllabus, just leave the upload box visible
                })
                .catch(() => {});
        }

        function handleCurrUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (file.type !== 'application/pdf') {
                document.getElementById('currLbl').textContent = '❌ Only PDF files allowed';
                input.value = '';
                return;
            }
            document.getElementById('currBox').style.borderColor = '#22c55e';
            document.getElementById('currBox').style.background = '#f0fdf4';
            document.getElementById('currLbl').style.color = '#15803d';
            document.getElementById('currLbl').textContent = '✅ ' + file.name;
            document.getElementById('currEye').style.display = 'block';

            const sid = localStorage.getItem('studentId');
            const resultDiv = document.getElementById('curriculumResult');
            resultDiv.innerHTML = `<div style="text-align:center;padding:1.5rem;background:#f0f9ff;border-radius:10px;border:1px solid #bae6fd;">
                <p style="color:#0369a1;font-weight:600;">⏳ Analyzing your curriculum...</p></div>`;

            // Save to backend then analyze
            const fd = new FormData();
            fd.append('file', file);
            fetch(`${API_URL}/analysis/save-syllabus/${sid}`, { method: 'POST', body: fd })
                .then(() => {
                    const fd2 = new FormData();
                    fd2.append('file', file);
                    return fetch(`${API_URL}/analysis/curriculum-gap`, { method: 'POST', body: fd2 });
                })
                .then(r => r.json())
                .then(data => renderCurriculumResult(data))
                .catch(e => { resultDiv.innerHTML = `<p style="color:#dc2626;">❌ ${e.message}</p>`; });
        }

        function previewCurrPdf() {
            const input = document.getElementById('curr_pdf');
            if (input && input.files[0]) window.open(URL.createObjectURL(input.files[0]), '_blank');
        }

        function renderCurriculumResult(data) {
            const resultDiv = document.getElementById('curriculumResult');
            if (!resultDiv) return;
            if (!data.success) return;

            const domainCards = Object.entries(data.industry_comparison).map(([domain, info]) => {
                const pct = info.coverage_percent || 0;
                const color = pct >= 60 ? '#16a34a' : pct >= 30 ? '#d97706' : '#dc2626';
                const bg = pct >= 60 ? '#dcfce7' : pct >= 30 ? '#fef3c7' : '#fee2e2';

                const taught = (info.taught_in_college || []).map(s =>
                    `<span style="padding:0.25rem 0.6rem;background:#dcfce7;color:#15803d;border-radius:6px;font-size:0.78rem;margin:0.2rem;display:inline-block;">✅ ${s.skill} <em style="opacity:0.7">(${s.college_level})</em></span>`
                ).join('');

                const missing = (info.skill_gaps || []).map(s =>
                    `<span style="padding:0.25rem 0.6rem;background:#fee2e2;color:#dc2626;border-radius:6px;font-size:0.78rem;margin:0.2rem;display:inline-block;">✗ ${s.skill} <em style="opacity:0.7">(needs ${s.industry_level})</em></span>`
                ).join('');

                return `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:1.25rem;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
                        <span style="font-weight:700;color:#1e293b;font-size:0.95rem;">${domain}</span>
                        <span style="background:${bg};color:${color};padding:0.2rem 0.75rem;border-radius:20px;font-size:0.8rem;font-weight:700;">${pct}% covered</span>
                    </div>
                    ${taught ? `<p style="font-size:0.78rem;font-weight:600;color:#15803d;margin-bottom:0.3rem;">📗 Taught (${info.total_covered}/${info.total_required})</p><div style="margin-bottom:0.75rem;">${taught}</div>` : `<p style="font-size:0.78rem;color:#94a3b8;margin-bottom:0.5rem;">None detected</p>`}
                    ${missing ? `<p style="font-size:0.78rem;font-weight:600;color:#dc2626;margin-bottom:0.3rem;">📕 Missing</p><div>${missing}</div>` : ''}
                </div>`;
            }).join('');

            resultDiv.innerHTML = `
                <div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;padding:1rem;margin-bottom:1rem;">
                    <p style="font-weight:700;color:#15803d;margin-bottom:0.25rem;">✅ Curriculum Analyzed — ${data.topics_found} topics extracted</p>
                    <p style="color:#166534;font-size:0.85rem;">Best match: <strong>${data.best_matching_domain}</strong> (${data.best_coverage}% industry coverage)</p>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;">${domainCards}</div>`;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
        
        loadResults();
    </script>
</body>
</html>
