<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - Student Career Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header {
            background: white;
            border-radius: 16px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 { color: #1e293b; font-size: 1.6rem; font-weight: 700; }
        .header p { color: #64748b; font-size: 0.9rem; margin-top: 0.2rem; }
        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 0.65rem 1.3rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-outline {
            background: white;
            color: #3b82f6;
            border: 2px solid #3b82f6;
        }
        .btn-outline:hover { background: #3b82f6; color: white; }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 1.25rem;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .stat-card .num { font-size: 2rem; font-weight: 700; }
        .stat-card .lbl { font-size: 0.82rem; color: #64748b; margin-top: 0.2rem; }

        /* Filter tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tab {
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            background: white;
            color: #64748b;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active { border-color: #3b82f6; background: #3b82f6; color: white; }
        .tab:hover:not(.active) { border-color: #3b82f6; color: #3b82f6; }

        /* Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }
        .app-card {
            background: white;
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-left: 4px solid #3b82f6;
            transition: transform 0.2s;
            position: relative;
        }
        .app-card:hover { transform: translateY(-3px); }
        .app-card.selected  { border-left-color: #16a34a; }
        .app-card.shortlisted { border-left-color: #d97706; }
        .app-card.rejected  { border-left-color: #dc2626; }

        .app-logo {
            width: 46px; height: 46px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 700; color: white;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            flex-shrink: 0;
        }
        .status-badge {
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .badge-Applied     { background: #dbeafe; color: #1d4ed8; }
        .badge-Shortlisted { background: #fef3c7; color: #b45309; }
        .badge-Selected    { background: #dcfce7; color: #15803d; }
        .badge-Rejected    { background: #fee2e2; color: #dc2626; }

        .match-bar-bg { background: #f1f5f9; border-radius: 20px; height: 6px; margin-top: 0.4rem; }
        .match-bar-fill { height: 6px; border-radius: 20px; }

        .empty-state {
            background: white;
            border-radius: 16px;
            padding: 4rem 2rem;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .empty-state h2 { color: #1e293b; margin-bottom: 0.75rem; }
        .empty-state p { color: #64748b; margin-bottom: 1.5rem; }

        select.status-select {
            padding: 0.3rem 0.6rem;
            border-radius: 20px;
            border: 1.5px solid #e2e8f0;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            background: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>📋 My Applications</h1>
            <p id="headerSub">Track every job you've applied to</p>
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
            <a href="jobs.html" class="btn">+ Apply More Jobs</a>
            <a href="results.html" class="btn btn-outline">📊 Dashboard</a>
            <a href="index.html" class="btn btn-outline">🏠 Home</a>
        </div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="tabs" id="tabs">
        <button class="tab active" onclick="filterApps('All', this)">All</button>
        <button class="tab" onclick="filterApps('Applied', this)">Applied</button>
        <button class="tab" onclick="filterApps('Shortlisted', this)">Shortlisted</button>
        <button class="tab" onclick="filterApps('Selected', this)">Selected 🎉</button>
        <button class="tab" onclick="filterApps('Rejected', this)">Rejected</button>
    </div>

    <div id="cardsContainer"></div>

    <!-- Curriculum Analysis Section -->
    <div style="background:white;border-radius:16px;padding:2rem;margin-top:2rem;box-shadow:0 4px 16px rgba(0,0,0,0.08);">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.25rem;">
            <div>
                <h2 style="color:#1e293b;font-size:1.3rem;font-weight:700;">📚 Curriculum Gap Analysis</h2>
                <p style="color:#64748b;font-size:0.88rem;margin-top:0.25rem;">Upload your college program PDF to see how it matches industry requirements</p>
            </div>
        </div>

        <div style="border:2px dashed #cbd5e1;border-radius:10px;padding:1.25rem;text-align:center;cursor:pointer;background:#f8fafc;transition:all 0.2s;position:relative;"
             id="currBox" onclick="document.getElementById('curr_pdf').click()">
            <input type="file" id="curr_pdf" accept=".pdf" style="display:none" onchange="handleCurrUpload(this)">
            <button type="button" id="currEye" onclick="event.stopPropagation();previewCurrPdf()" style="display:none;position:absolute;top:8px;right:10px;background:none;border:none;font-size:1.1rem;cursor:pointer;">👁</button>
            <label id="currLbl" style="cursor:pointer;color:#64748b;font-size:0.9rem;">📄 Click to upload College Program PDF (PDF only)</label>
        </div>

        <div id="curriculumResult" style="margin-top:1.25rem;"></div>
    </div>
</div>

<script>
    const API_URL = (window.location.port === '5500' || window.location.port === '5501')
        ? 'http://127.0.0.1:5000/api'
        : '/api';
    const studentName = localStorage.getItem('studentName');
    const studentId = localStorage.getItem('studentId');

    if (studentName) {
        document.getElementById('headerSub').textContent = `${studentName}'s job application history`;
    }

    if (!studentId) {
        document.getElementById('cardsContainer').innerHTML = `
            <div class="empty-state">
                <div style="font-size:3rem;margin-bottom:1rem;">🔒</div>
                <h2>Please login first</h2>
                <p>Your applications are saved to your account.</p>
                <a href="login.html" class="btn" style="margin-top:1rem;display:inline-block;">Login →</a>
            </div>`;
        document.getElementById('statsRow').innerHTML = '';
    } else {
        let allApps = [];
        let currentFilter = 'All';

        async function loadFromBackend() {
            try {
                const res = await fetch(`${API_URL}/applications/${studentId}`);
                const result = await res.json();
                if (result.success) {
                    allApps = result.data;
                    // Sync to localStorage cache for badge on jobs page
                    localStorage.setItem('applications', JSON.stringify(allApps));
                }
            } catch (e) {
                // Fallback to localStorage if backend unreachable
                allApps = JSON.parse(localStorage.getItem('applications') || '[]');
            }
            renderStats();
            renderCards();
        }

        // Re-read when tab becomes visible
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) loadFromBackend();
        });

        function renderStats() {
            const total = allApps.length;
            const selected = allApps.filter(a => a.status === 'Selected').length;
            const shortlisted = allApps.filter(a => a.status === 'Shortlisted').length;
            const rejected = allApps.filter(a => a.status === 'Rejected').length;
            const pending = allApps.filter(a => a.status === 'Applied').length;

            document.getElementById('statsRow').innerHTML = `
                <div class="stat-card">
                    <div class="num" style="color:#3b82f6;">${total}</div>
                    <div class="lbl">Total Applied</div>
                </div>
                <div class="stat-card">
                    <div class="num" style="color:#16a34a;">${selected}</div>
                    <div class="lbl">Selected 🎉</div>
                </div>
                <div class="stat-card">
                    <div class="num" style="color:#d97706;">${shortlisted}</div>
                    <div class="lbl">Shortlisted</div>
                </div>
                <div class="stat-card">
                    <div class="num" style="color:#64748b;">${pending}</div>
                    <div class="lbl">Pending</div>
                </div>
                <div class="stat-card">
                    <div class="num" style="color:#dc2626;">${rejected}</div>
                    <div class="lbl">Rejected</div>
                </div>`;
        }

        function filterApps(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const filtered = currentFilter === 'All' ? allApps : allApps.filter(a => a.status === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size:3rem;margin-bottom:1rem;">📭</div>
                        <h2>${currentFilter === 'All' ? "No applications yet" : "No " + currentFilter + " jobs"}</h2>
                        <p>${currentFilter === 'All' ? "Start applying to jobs to track them here." : "Nothing in this category yet."}</p>
                        ${currentFilter === 'All' ? '<a href="jobs.html" class="btn">Browse Jobs →</a>' : ''}
                    </div>`;
                return;
            }

            container.innerHTML = '<div class="cards-grid">' + filtered.map((app, i) => {
                const realIdx = allApps.indexOf(app);
                const matchColor = app.match_percentage >= 70 ? '#16a34a' : app.match_percentage >= 50 ? '#d97706' : '#dc2626';
                const cardClass = app.status === 'Selected' ? 'selected' : app.status === 'Shortlisted' ? 'shortlisted' : app.status === 'Rejected' ? 'rejected' : '';
                const initials = app.company.substring(0, 2).toUpperCase();

                return `
                <div class="app-card ${cardClass}">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;">
                        <div style="display:flex;gap:0.75rem;align-items:center;">
                            <div class="app-logo">${initials}</div>
                            <div>
                                <div style="font-weight:700;color:#1e293b;font-size:0.95rem;">${app.job_role}</div>
                                <div style="color:#3b82f6;font-size:0.85rem;font-weight:500;">${app.company}</div>
                            </div>
                        </div>
                        <span class="status-badge badge-${app.status}">${app.status === 'Selected' ? '🎉 ' : ''}${app.status}</span>
                    </div>

                    ${app.field ? `<div style="color:#64748b;font-size:0.82rem;margin-bottom:0.75rem;">🎓 ${app.field}</div>` : ''}

                    <div style="margin-bottom:0.75rem;">
                        <div style="display:flex;justify-content:space-between;font-size:0.82rem;color:#64748b;margin-bottom:0.3rem;">
                            <span>Match Score</span>
                            <span style="font-weight:700;color:${matchColor};">${app.match_percentage}%</span>
                        </div>
                        <div class="match-bar-bg">
                            <div class="match-bar-fill" style="width:${app.match_percentage}%;background:${matchColor};"></div>
                        </div>
                    </div>

                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding-top:0.75rem;border-top:1px solid #f1f5f9;">
                        <span style="font-size:0.8rem;color:#94a3b8;">📅 ${app.applied_date}</span>
                        <div style="display:flex;gap:0.5rem;align-items:center;">
                            <select class="status-select" onchange="updateStatus(${realIdx}, this.value)">
                                <option value="Applied"     ${app.status==='Applied'     ?'selected':''}>Applied</option>
                                <option value="Shortlisted" ${app.status==='Shortlisted' ?'selected':''}>Shortlisted</option>
                                <option value="Selected"    ${app.status==='Selected'    ?'selected':''}>Selected</option>
                                <option value="Rejected"    ${app.status==='Rejected'    ?'selected':''}>Rejected</option>
                            </select>
                            <button onclick="removeApp(${realIdx})" style="background:none;border:none;color:#cbd5e1;cursor:pointer;font-size:1rem;padding:0.2rem;" title="Remove">🗑</button>
                        </div>
                    </div>
                </div>`;
            }).join('') + '</div>';
        }

        async function updateStatus(index, newStatus) {
            const app = allApps[index];
            if (!app) return;
            try {
                await fetch(`${API_URL}/applications/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: app.id, status: newStatus })
                });
            } catch(e) {}
            allApps[index].status = newStatus;
            localStorage.setItem('applications', JSON.stringify(allApps));
            renderStats();
            renderCards();
        }

        async function removeApp(index) {
            const app = allApps[index];
            if (!app) return;
            try {
                await fetch(`${API_URL}/applications/${app.id}`, { method: 'DELETE' });
            } catch(e) {}
            allApps.splice(index, 1);
            localStorage.setItem('applications', JSON.stringify(allApps));
            renderStats();
            renderCards();
        }

        // Init
        loadFromBackend();
    }

    // Curriculum upload
    function handleCurrUpload(input) {
        const file = input.files[0];
        const box = document.getElementById('currBox');
        const lbl = document.getElementById('currLbl');
        const eye = document.getElementById('currEye');
        if (!file) return;
        if (file.type !== 'application/pdf') {
            lbl.textContent = '❌ Only PDF files allowed';
            input.value = '';
            return;
        }
        box.style.borderColor = '#22c55e';
        box.style.background = '#f0fdf4';
        lbl.style.color = '#15803d';
        lbl.textContent = '✅ ' + file.name;
        eye.style.display = 'block';
        analyzeCurriculum(input);
    }

    function previewCurrPdf() {
        const input = document.getElementById('curr_pdf');
        if (input && input.files[0]) window.open(URL.createObjectURL(input.files[0]), '_blank');
    }

    async function analyzeCurriculum(input) {
        const file = input.files[0];
        if (!file) return;
        const resultDiv = document.getElementById('curriculumResult');
        resultDiv.innerHTML = `<div style="text-align:center;padding:1.5rem;background:#f0f9ff;border-radius:10px;border:1px solid #bae6fd;">
            <div style="font-size:1.5rem;margin-bottom:0.5rem;">⏳</div>
            <p style="color:#0369a1;font-weight:600;">Analyzing your curriculum...</p>
            <p style="color:#0c4a6e;font-size:0.85rem;">Extracting subjects and comparing with industry requirements</p>
        </div>`;

        try {
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch(`${API_URL}/analysis/curriculum-gap`, { method: 'POST', body: formData });
            const data = await res.json();

            if (!data.success) { resultDiv.innerHTML = `<p style="color:#dc2626;">❌ ${data.error}</p>`; return; }

            const domainCards = Object.entries(data.industry_comparison).map(([domain, info]) => {
                const pct = info.coverage_percentage || 0;
                const color = pct >= 60 ? '#16a34a' : pct >= 30 ? '#d97706' : '#dc2626';
                const bg = pct >= 60 ? '#dcfce7' : pct >= 30 ? '#fef3c7' : '#fee2e2';
                const taught = (info.taught_skills || []).map(s =>
                    `<span style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.25rem 0.6rem;background:#dcfce7;color:#15803d;border-radius:6px;font-size:0.78rem;margin:0.2rem;">✅ ${s.skill} <em style="opacity:0.7">(${s.level})</em></span>`
                ).join('');
                const missing = (info.missing_skills || []).map(s =>
                    `<span style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.25rem 0.6rem;background:#fee2e2;color:#dc2626;border-radius:6px;font-size:0.78rem;margin:0.2rem;">✗ ${s.skill} <em style="opacity:0.7">(needs ${s.required_level})</em></span>`
                ).join('');

                return `<div style="background:white;border:1px solid #e2e8f0;border-radius:12px;padding:1.25rem;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
                        <span style="font-weight:700;color:#1e293b;font-size:0.95rem;">${domain}</span>
                        <span style="background:${bg};color:${color};padding:0.2rem 0.75rem;border-radius:20px;font-size:0.8rem;font-weight:700;">${pct}% covered</span>
                    </div>
                    ${taught ? `<p style="font-size:0.78rem;font-weight:600;color:#15803d;margin-bottom:0.3rem;">📗 Taught in College (${info.taught_count}/${info.total_required})</p><div style="margin-bottom:0.75rem;">${taught}</div>` : ''}
                    ${missing ? `<p style="font-size:0.78rem;font-weight:600;color:#dc2626;margin-bottom:0.3rem;">📕 Industry Expects (Missing Skills)</p><div>${missing}</div>` : ''}
                </div>`;
            }).join('');

            resultDiv.innerHTML = `
                <div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;padding:1rem;margin-bottom:1rem;">
                    <p style="font-weight:700;color:#15803d;margin-bottom:0.25rem;">✅ Curriculum Analyzed — ${data.topics_found} topics extracted</p>
                    <p style="color:#166534;font-size:0.85rem;">Best match: <strong>${data.best_matching_domain}</strong> (${data.best_coverage}% industry coverage)</p>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;">${domainCards}</div>`;
        } catch (e) {
            resultDiv.innerHTML = `<p style="color:#dc2626;">❌ Error: ${e.message}</p>`;
        }
    }
</script>
</body>
</html>
