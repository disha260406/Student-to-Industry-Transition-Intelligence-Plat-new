services:
  - type: web
    name: student-career-platform
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python ml/train_model.py
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false

